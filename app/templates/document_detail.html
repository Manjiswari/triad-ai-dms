{% extends "base.html" %}
{% block title %}Document Details - Triad AI DMS{% endblock %}
{% block content %}
<div class="max-w-4xl mx-auto space-y-6">
    <a href="/" class="inline-flex items-center text-xs font-semibold text-slate-500 hover:text-slate-800"><i class="fa-solid fa-arrow-left mr-1.5"></i> Back to Hub</a>
    <div id="doc-loading" class="bg-white p-12 text-center rounded-2xl border border-slate-200">
        <i class="fa-solid fa-circle-notch fa-spin text-3xl text-brand-600 mb-2"></i>
        <p class="text-sm text-slate-500">Loading document details...</p>
    </div>
    <div id="doc-details-card" class="hidden bg-white rounded-2xl border border-slate-200 shadow-sm p-6 sm:p-8 space-y-6">
        <div class="flex flex-col md:flex-row md:items-start justify-between gap-4 border-b border-slate-100 pb-6">
            <div>
                <div class="flex items-center gap-2 mb-2">
                    <span id="doc-division-badge" class="px-2.5 py-0.5 rounded-md text-xs font-bold uppercase"></span>
                    <span id="doc-access-status-badge" class="px-2.5 py-0.5 rounded-md text-xs font-semibold"></span>
                </div>
                <h1 id="doc-title" class="text-2xl font-bold text-slate-900"></h1>
                <p id="doc-filename-meta" class="text-xs text-slate-400 mt-1"></p>
            </div>
            <div id="doc-primary-action"></div>
        </div>
        <div class="py-4 border-b border-slate-100">
            <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-3">Dynamic Custom Metadata</h2>
            <div id="doc-metadata-grid" class="grid grid-cols-2 sm:grid-cols-3 gap-4"></div>
        </div>
        <div class="pt-2">
            <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-3">OCR Extracted Text</h2>
            <pre id="doc-ocr-text" class="bg-slate-900 text-slate-100 p-5 rounded-xl text-xs overflow-y-auto max-h-96 whitespace-pre-wrap select-all font-sans"></pre>
        </div>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script>
    const currentDocId = "{{ doc_id }}";
    async function loadDocumentDetails() {
        const res = await apiFetch(`/documents/${currentDocId}`);
        const loadingEl = document.getElementById('doc-loading');
        const cardEl = document.getElementById('doc-details-card');
        if (!res.ok || !res.data?.document) {
            loadingEl.innerHTML = '<p class="text-red-500 font-semibold">Document not found</p>';
            return;
        }
        const doc = res.data.document;
        loadingEl.classList.add('hidden');
        cardEl.classList.remove('hidden');

        document.getElementById('doc-title').textContent = doc.title || doc.filename;
        document.getElementById('doc-filename-meta').textContent = `${doc.filename} • ${(doc.file_size / 1024).toFixed(1)} KB • Uploader: ${doc.uploader_name || 'System'}`;

        const divBadge = document.getElementById('doc-division-badge');
        divBadge.textContent = doc.division;
        divBadge.className = `px-2.5 py-0.5 rounded-md text-xs font-bold uppercase ${doc.division === 'Division A' ? 'bg-emerald-100 text-emerald-800' : 'bg-blue-100 text-blue-800'}`;

        const accessBadge = document.getElementById('doc-access-status-badge');
        accessBadge.textContent = doc.can_download ? 'Access Granted' : 'Restricted (Cross-Division)';
        accessBadge.className = `px-2.5 py-0.5 rounded-md text-xs font-semibold ${doc.can_download ? 'bg-emerald-50 text-emerald-700' : 'bg-amber-50 text-amber-700'}`;

        const actionContainer = document.getElementById('doc-primary-action');
        if (doc.can_download) {
            actionContainer.innerHTML = `<a href="/api/documents/${doc.id}/download${getToken() ? '?token=' + getToken() : ''}" class="px-5 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold text-sm rounded-xl shadow flex items-center gap-2"><i class="fa-solid fa-download"></i> Download File</a>`;
        } else if (doc.request_status === 'pending') {
            actionContainer.innerHTML = `<button disabled class="px-5 py-2.5 bg-amber-100 text-amber-800 font-semibold text-sm rounded-xl cursor-not-allowed">Request Pending</button>`;
        } else {
            actionContainer.innerHTML = `<button onclick="requestAccessForCurrentDoc()" class="px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-semibold text-sm rounded-xl shadow flex items-center gap-2"><i class="fa-solid fa-key"></i> Request Access</button>`;
        }

        const metaGrid = document.getElementById('doc-metadata-grid');
        metaGrid.innerHTML = '';
        if (doc.metadata) {
            for (const [k, v] of Object.entries(doc.metadata)) {
                metaGrid.innerHTML += `<div class="bg-slate-50 p-3 rounded-xl border border-slate-200"><div class="text-[10px] font-bold uppercase text-slate-400 mb-1">${k}</div><div class="text-sm font-semibold text-slate-800">${v || '—'}</div></div>`;
            }
        }
        document.getElementById('doc-ocr-text').textContent = doc.extracted_text || 'No text extracted';
    }
    async function requestAccessForCurrentDoc() {
        const reason = prompt('Please enter reason for requesting cross-division access:');
        if (reason === null) return;
        const res = await apiFetch('/access/request', {
            method: 'POST',
            body: JSON.stringify({ doc_id: currentDocId, reason: reason || 'Business access' })
        });
        if (res.ok) {
            showToast('Access request submitted!', 'success');
            loadDocumentDetails();
        } else {
            showToast(res.data?.error || 'Failed', 'error');
        }
    }
    document.addEventListener('DOMContentLoaded', loadDocumentDetails);
</script>
{% endblock %}
